[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobs-lan-file-server"
version = "2.0.0"
description = "Desktop-managed LAN file sharing with Python and Nginx streaming backends"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.7",
    "qrcode>=8.0",
    "Pillow>=10.0; platform_system != 'Darwin'",
    "pillow-heif>=0.18.0; platform_system != 'Darwin'",
]

[project.scripts]
lan-file-server = "lanfileserver.ui:main"

[tool.setuptools.packages.find]
include = ["lanfileserver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
